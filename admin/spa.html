<!DOCTYPE html>
<html lang="zh-CN" data-skin="social-blue" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0C14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="NOVA 社区管理端，用户、内容、举报与会员权益。" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>NOVA 管理端</title>
    <script>
      (function () {
        function show(text) {
          try {
            var el = document.getElementById("nova-fatal");
            if (!el) {
              el = document.createElement("div");
              el.id = "nova-fatal";
              el.setAttribute("style", "position:fixed;left:0;right:0;bottom:0;z-index:2147483647;max-height:60vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:#2a0f14;color:#ffd7dc;font:12px/1.5 -apple-system,monospace;white-space:pre-wrap;word-break:break-all;");
              (document.body || document.documentElement).appendChild(el);
            }
            el.textContent = (el.textContent ? el.textContent + "\n\n" : "管理端出错了，请把这段截图发给我：\n") + text + "\nUA: " + navigator.userAgent + "\nURL: " + location.href;
          } catch (e) {}
        }
        window.__NOVA_SHOW_ERROR__ = show;
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (t && t !== window && (t.src || t.href)) { show("资源加载失败: " + (t.src || t.href)); return; }
          show(String((e && e.message) || "error") + "\n" + ((e && e.error && e.error.stack) || "") + "\n" + ((e && e.filename) || "") + ":" + ((e && e.lineno) || ""));
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason; show("Promise 未处理: " + String((r && (r.stack || r.message)) || r));
        });
      })();
    </script>
    <script>
      (function () {
        var colors = { "social-blue": { dark: "#17212B", light: "#F0F2F5" }, pulse: { dark: "#0B0B0D", light: "#F7FBFB" } };
        var renames = { facebook: "social-blue", tiktok: "pulse", social: "social-blue" };
        var defaults = { "social-blue": "light", pulse: "dark" };
        try {
          var raw = localStorage.getItem("nova-admin-skin") || "";
          var skin = renames[raw] || raw;
          if (skin !== "pulse" && skin !== "social-blue") skin = "social-blue";
          if (raw && raw !== skin) localStorage.setItem("nova-admin-skin", skin);
          var m = localStorage.getItem("nova-admin-theme");
          if (m !== "light" && m !== "dark" && m !== "system") m = defaults[skin];
          var light = m === "light" || (m === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.setAttribute("data-skin", skin);
          document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
          document.documentElement.style.colorScheme = light ? "light" : "dark";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", colors[skin][light ? "light" : "dark"]);
        } catch (e) {
          document.documentElement.setAttribute("data-skin", "social-blue");
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <style>
      html, body, #root { position: fixed; inset: 0; width: 100%; max-width: 100%; height: 100%; height: 100vh; height: 100dvh; min-height: 100%; min-height: 100vh; min-height: 100dvh; margin: 0; overflow: hidden; overscroll-behavior: none; }
      html, body { background: #17212B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      html[data-skin="pulse"], html[data-skin="pulse"] body { background: #0B0B0D; }
      html[data-skin="social-blue"][data-theme="light"], html[data-skin="social-blue"][data-theme="light"] body { background: #F0F2F5; }
      html[data-skin="pulse"][data-theme="light"], html[data-skin="pulse"][data-theme="light"] body { background: #F7FBFB; }
      #nova-static-splash {
        min-height: 100vh; min-height: 100dvh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
        padding: max(32px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(32px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
        color: #F5F7FA;
        background:
          radial-gradient(80% 50% at 50% 34%, rgba(75,139,245,.38), transparent 72%),
          #17212B;
      }
      html[data-skin="social-blue"][data-theme="light"] #nova-static-splash {
        color: #1C1E21;
        background:
          radial-gradient(80% 50% at 50% 34%, rgba(24,119,242,.18), transparent 72%),
          #F0F2F5;
      }
      html[data-skin="pulse"] #nova-static-splash {
        color: #F7F7F8;
        background:
          radial-gradient(80% 50% at 50% 34%, rgba(37,244,238,.28), transparent 72%),
          #0B0B0D;
      }
      html[data-skin="pulse"][data-theme="light"] #nova-static-splash {
        color: #15171A;
        background:
          radial-gradient(80% 50% at 50% 34%, rgba(8,127,131,.18), transparent 72%),
          #F7FBFB;
      }
      #nova-static-splash .nova-static-brand {
        margin: 20px 0 0;
        font-size: 28px; font-weight: 800; letter-spacing: .06em; line-height: 1;
        background: linear-gradient(180deg, #8BA3FF 0%, #6E8BFF 48%, #5B74F2 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      html[data-theme="light"] #nova-static-splash .nova-static-brand {
        background: linear-gradient(180deg, #6B86FF 0%, #4F6EF7 50%, #3D58E0 100%);
        -webkit-background-clip: text; background-clip: text;
      }
      #nova-static-splash .nova-static-sub {
        margin: 8px 0 0; font-size: 15px; font-weight: 700; letter-spacing: .12em;
        color: #6E8BFF;
      }
      html[data-theme="light"] #nova-static-splash .nova-static-sub { color: #4F6EF7; }
      #nova-static-msg { display: none; max-width: 320px; font-size: 14px; line-height: 1.6; margin: 16px 0 0; opacity: .85; }
      #nova-static-btn {
        display: none; margin-top: 16px; height: 44px; padding: 0 22px; border: 0;
        border-radius: 14px; background: linear-gradient(180deg, #8BA3FF 0%, #6E8BFF 48%, #5B74F2 100%);
        color: #fff; font-size: 16px; font-weight: 700; letter-spacing: .02em;
        box-shadow: 0 4px 14px rgba(110,139,255,.38);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="nova-static-splash">
        <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
          <defs>
            <linearGradient id="boot-star" x1="32" y1="2" x2="32" y2="48" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#F0F3FF"/>
              <stop offset=".35" stop-color="#C5D0FF"/>

              <stop offset="0" stop-color="#4ECDC4"/>
              <stop offset=".5" stop-color="#6E8BFF"/>
              <stop offset="1" stop-color="#A8BAFF"/>
            </linearGradient>
          </defs>
          <path fill="url(#boot-star)" d="M32 2.8C33.35 16.4 36.1 22.7 48.2 25.15C36.1 27.6 33.35 33.9 32 47.5C30.65 33.9 27.9 27.6 15.8 25.15C27.9 22.7 30.65 16.4 32 2.8Z"/>
          <path fill="url(#boot-star)" opacity=".92" transform="rotate(45 32 25.15)" d="M32 12.2C32.7 18.5 34.4 21.7 41.2 23.15C34.4 24.6 32.7 27.8 32 34.1C31.3 27.8 29.6 24.6 22.8 23.15C29.6 21.7 31.3 18.5 32 12.2Z"/>
          <circle cx="11.5" cy="12.5" r="1.2" fill="#A8BAFF" opacity=".9"/>
          <circle cx="53" cy="11" r=".85" fill="#F0F3FF" opacity=".95"/>
          <circle cx="54.5" cy="21.5" r="1.05" fill="#6E8BFF" opacity=".8"/>
          <circle cx="9.5" cy="23" r=".7" fill="#4ECDC4" opacity=".75"/>
          <path fill="none" stroke="url(#boot-wave)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M7.5 48.2c6.8-5.6 13-5.6 19.6 0s13 5.6 19.6 0 10.2-5.3 11.3-5"/>
          <path fill="none" stroke="url(#boot-wave)" stroke-width="1.7" stroke-linecap="round" opacity=".55" d="M11.5 55.4c5.7-4.3 11.4-4.3 17.1 0s11.4 4.3 17.1 0 8.6-4.1 9.6-3.9"/>
        </svg>
        <p class="nova-static-brand">NOVA</p>
        <p class="nova-static-sub">管理端</p>
        <p id="nova-static-msg">正在进入管理端。如果长时间没有变化，请关闭后重新打开。</p>
        <button type="button" id="nova-static-btn">刷新重试</button>
      </div>
    </div>
    <script>
      window.__NOVA_BOOTED__ = false;
      setTimeout(function () {
        if (window.__NOVA_BOOTED__) return;
        var msg = document.getElementById("nova-static-msg");
        var btn = document.getElementById("nova-static-btn");
        if (msg) { msg.style.display = "block"; }
        if (btn) {
          btn.style.display = "inline-block";
          btn.onclick = function () { window.location.reload(); };
        }
      }, 4000);
    </script>
    <script type="module" src="/src/spa-main.tsx"></script>
  </body>
