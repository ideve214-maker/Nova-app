.cchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 8px}
.cchips .chip{height:28px;padding:0 10px;border-radius:14px;background:var(--s2);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.cchips .chip button{color:var(--t2);font-size:14px}
.audlist button{display:flex;width:100%;text-align:left;padding:12px 4px;align-items:center;gap:12px;border-bottom:.5px solid var(--ln);font-size:15px}
.audlist button.on{color:var(--ac);font-weight:700}
.moodg{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.moodg button{height:36px;padding:0 12px;border-radius:18px;background:var(--s2);font-size:15px}
.moodg button.on{background:var(--ac-soft);color:var(--ac);font-weight:700}


.mrcard{background:var(--sf);border-bottom:8px solid var(--bg)}
.mrcard .gr b{font-size:15px}

/* 社区大卡片：单列，全宽圆角封面，完整「加入小组」按钮 */
.ggrid{display:flex;flex-direction:column;gap:14px;padding:10px 16px 24px}
.gcard{background:var(--sf);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;text-align:left;min-width:0;box-shadow:0 1px 4px rgba(0,0,0,.22)}
.gcover{width:100%;height:168px;background:var(--s3) center/cover no-repeat;border:0;display:block;border-radius:18px 18px 0 0}
.gbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.gbody b{font-size:17px;font-weight:800;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gbody .gmeta{font-size:13px;color:var(--t2);font-weight:500}
.gbody .gintro{font-size:13px;color:var(--t2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.gbody .pb{width:100%;margin-top:10px;height:40px;min-height:40px;border-radius:12px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.gbody .pb .ic-line{width:18px;height:18px;color:currentColor}
.gmini{background:var(--sf);border-radius:18px;overflow:hidden;display:flex;align-items:center;gap:14px;padding:14px;margin:10px 16px 0;text-align:left;width:calc(100% - 32px);box-shadow:0 1px 4px rgba(0,0,0,.22);border:0;color:inherit;position:sticky;top:0;z-index:3}
.gmini .ico{width:56px;height:56px;border-radius:16px;background:linear-gradient(160deg,var(--ac),#1B6FE0);color:#fff;display:grid;place-items:center;flex:none}
.gmini .ico .ic-line{width:30px;height:30px;color:#fff}
.gmini b{display:block;font-size:16px;font-weight:800}
.gmini small{color:var(--t2);font-size:13px}
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 24px}
.gtile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--sf);color:var(--tx);border-radius:16px;padding:12px;min-height:132px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.gtile b{font-size:16px}.gtile small{color:var(--t2);font-size:12px;line-height:1.35}.gtile em{margin-top:auto;font-style:normal;color:var(--ac);font-size:12px;font-weight:700}
.gico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--ac);color:var(--onac);overflow:hidden;flex:none}.gico svg,.gico-svg{width:22px;height:22px;display:block}
.game-frame{padding:0!important;background:var(--bg)}
.game-frame iframe{width:100%;height:100%;border:0;background:var(--bg);overscroll-behavior:contain}
.vhost{position:relative;width:100%}
.pswp{z-index:80}
/* 发现页邀请码卡片：输入与「加入」同一行，按钮在卡片内垂直居中并靠右 */
.jcard{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:8px 16px 0;padding:10px 12px;background:var(--sf);border-radius:18px;box-shadow:0 1px 4px rgba(0,0,0,.22)}
.jcard .fld{flex:1 1 auto;width:auto;min-width:0;margin:0}
.jcard .pb{margin-left:auto;align-self:center;flex:none}

/* 好友请求卡片 */
.freq{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--sf);border-bottom:.5px solid var(--ln)}
.freq .acts{display:flex;gap:6px;flex:none}
/* 个人主页：封面 + 左侧重叠头像 */
.cvr.tall{height:180px;position:relative}
.pf.ovl{text-align:left;padding:0 16px 16px;position:relative;background:var(--sf)}
.avw.ovl{position:relative;width:88px;height:88px;margin:-44px 0 8px;border-radius:50%;border:4px solid var(--sf);background:var(--sf);display:grid;place-items:center}
.pf.ovl h2{font-size:22px;margin:0}
.pf.ovl .handle{color:var(--t2);font-size:14px}
.pf.ovl .bio{margin:6px 0 10px;font-size:14px;color:var(--tx)}
.pf.ovl .sts{justify-content:flex-start;gap:12px;margin-bottom:12px}
.pf.ovl .fr{justify-content:stretch}
.panel-sheet .mi{height:48px}


@keyframes ttIn{from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.94)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes ttOut{from{opacity:1;transform:translateX(-50%) scale(1)}to{opacity:0;transform:translateX(-50%) translateY(8px) scale(.96)}}
#tt.tt-in{animation:ttIn .2s cubic-bezier(.32,.72,0,1) both}
#tt.tt-out{animation:ttOut .18s ease both}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
@keyframes pnIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.ov{animation:ovIn .18s ease both}
.pn{animation:pnIn .22s cubic-bezier(.32,.72,0,1) both}
html.rm #tt.tt-in,html.rm #tt.tt-out,html.rm .ov,html.rm .pn,body.rm #tt.tt-in,body.rm #tt.tt-out,body.rm .ov,body.rm .pn{animation:none}


/* 社区视图：单 / 双 / 四 */
.ggrid.v1{display:flex;flex-direction:column;gap:14px;padding:10px 16px 24px}
.ggrid.v2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 24px}

.ggrid.v2 .gbody{padding:8px 10px 10px;gap:4px}

.ggrid.v4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:8px 8px 24px}

.ggrid.v4 .gbody .pb{height:22px;min-height:22px;margin-top:3px;font-size:10px;padding:0 2px;border-radius:7px;gap:0}

.ib .ic-line{width:20px;height:20px;color:var(--tx)}
