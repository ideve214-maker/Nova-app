name: Admin capacitor assets

# Icons are generated from admin/resources. A failed generation fails this job.
# This workflow does not build or upload an install package.
on:
  workflow_dispatch:
  push:
    paths:
      - "admin/resources/**"
      - "admin/scripts/generate-capacitor-assets.sh"
      - ".github/workflows/admin-capacitor-assets.yml"

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      # Assets only: no install package is built here, so no hot-update URL is needed.
      NOVA_REQUIRE_UPDATE_URL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install admin dependencies
        working-directory: admin
        run: npm ci
      - name: Install Capacitor CLI and native platforms (not saved to package.json)
        working-directory: admin
        run: npm i --no-save --no-audit --no-fund @capacitor/cli@^7 @capacitor/android@^7 @capacitor/ios@^7
      - name: Generate launcher assets from resources
        working-directory: admin
        run: bash scripts/generate-capacitor-assets.sh
