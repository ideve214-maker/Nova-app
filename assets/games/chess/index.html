<!DOCTYPE HTML>
<html>
<head>
<meta charset="UTF-8">
<title>中国象棋</title>
<meta name="viewport" content="width=device-width; initial-scale=1.0" />
<link href="css/chess.css" rel="stylesheet" type="text/css">
<!--[if lt IE 9]>
<script> alert("对不起，您的浏览器不支持HTML5，请升级浏览器至IE9、firefox或者谷歌浏览器！")</script>
< ![endif]-->
<style data-nova-hide-sb>html,body,*{scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0}</style>
<style>html,body{margin:0;height:100%;overflow:hidden}#chess{display:block;margin:0 auto} .menu_box{transform-origin:top center}</style></head>
<body data-game="chess">
<div id="chessBox" class="chess_box">
	<canvas id="chess"></canvas>
	<audio src="audio/click.wav" id="clickAudio" preload="auto"></audio>
	<audio src="audio/select.wav" id="selectAudio" preload="auto"></audio>
	<div class="bn_box" id="bnBox">
		<input type="button" name="restartBtn" id="restartBtn" value="  重新开始  " />
		<input type="button" name="gohomeBtn" id="gohomeBtn" value="  返回首页  " />
		<input type="button" name="regretBtn" id="regretBtn" value="  悔   棋  " />
	</div>
</div>
<div class="menu_box" id="menuBox">
	<div class="menu_init" id="indexBox"><a id="indexDy">人机对弈</a><a id="indexQj">挑战棋局</a><a id="stypeBtn">更换皮肤</a></div>
	<div class="menu_dy" id="menuDy">
		<div class="menu_info">
			<div class="menu_fh" id="menuFh"></div>
			<label>
				<input name="depth" type="radio" value="2">
				菜鸟水平</label>
			<br />
			<label>
				<input name="depth" type="radio" value="3" checked>
				中级水平</label>
			<br />
			<label>
				<input name="depth" type="radio" value="4">
				高手水平</label>
		</div>
		<a id="playBtn">开始对弈</a> </div>
	<div class="menu_qj" id="menuQj">
		<div class="menu_info">
			<div class="menu_fh" id="menuGb"></div>
			<label>
				<input name="clasli" type="radio" value="0" checked>
				八卦阵法</label>
			<br />
			<label>
				<input name="clasli" type="radio" value="1">
				很二棋局</label>
			<br />
			<label>
				<input name="clasli" type="radio" value="2">
				七星会阵</label>
		</div>
		<a id = "clasliBtn">开始挑战</a> </div>
</div>
<script type="text/javascript" src="js/common.js"></script>
<script type="text/javascript" src="js/play.js"></script>
<script type="text/javascript" src="js/AI.js"></script>
<script type="text/javascript" src="js/gambit.js"></script>
<script type="text/javascript" src="js/clasli.js"></script>
<script type="text/javascript" charset="utf-8" src="js/cordova-2.2.0.js"></script>
<script>
(function(){
  var game=document.body.getAttribute('data-game')||'';
  function send(n){n=Number(n)||0;if(!(n>0))return;try{parent.postMessage({type:'nova-score',game:game,score:n},'*')}catch(e){}}
  setInterval(function(){
    var el=document.querySelector('.score-container,#score,.score');
    if(!el)return;
    var n=parseInt(String(el.textContent).replace(/[^0-9]/g,''),10);
    if(n>0)send(n);
  },900);
})();
</script>
<script>
(function(){
  function fit(){
    var canvas=document.getElementById('chess');
    var menu=document.getElementById('menuBox');
    var vw=document.documentElement.clientWidth||window.innerWidth;
    var vh=document.documentElement.clientHeight||window.innerHeight;
    if(canvas&&canvas.width&&canvas.height){
      var s=Math.min(vw/canvas.width,(vh-72)/canvas.height,1);
      if(s>0){
        canvas.style.width=Math.floor(canvas.width*s)+'px';
        canvas.style.height=Math.floor(canvas.height*s)+'px';
      }
    }
    if(menu){
      var s2=Math.min(vw/316,(vh-16)/430,1);
      menu.style.transform='scale('+(s2>0?s2:1)+')';
    }
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  setInterval(fit, 500);
})();
</script>
</body>
</html>
