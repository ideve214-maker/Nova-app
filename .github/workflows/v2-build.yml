name: VEXO packages (build only)

# Push to build/v2 = build + verify + upload artifacts. NEVER publishes a Release.
# Publishing is a separate, manual workflow: release-draft.yml (creates a DRAFT).
#
# Which source commits are built:
#   push              -> USER_SHA / ADMIN_SHA below (the ONE place to pin them)
#   workflow_dispatch -> the user_sha / admin_sha inputs (empty = the pins below)
on:
  push:
    branches: [build/v2]
  workflow_dispatch:
    inputs:
      user_sha:
        description: 'User app (VEXO) commit, full 40-char SHA. Empty = USER_SHA pin in this file.'
        type: string
        default: ''
      admin_sha:
        description: 'Admin app commit, full 40-char SHA. Empty = ADMIN_SHA pin in this file.'
        type: string
        default: ''
      apps:
        description: 'Which apps to build'
        type: choice
        options: [both, user, admin]
        default: both
      deploy_admin:
        description: 'Upload admin APK/IPA to the hidden server download dir'
        type: boolean
        default: true

concurrency:
  group: vexo-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ---- source pins (full SHAs; never branch names) -------------------------
  USER_SHA: 9b5bdb2154a5fac3675c0abc6959e558f4bbded0   # v7-m7.r8-vexo (Bob)
  ADMIN_SHA: c67a21cecca1b3aeae106df13492d4d9ab606dfd  # admin-vexo-1.1.0 (Agent), entry dist-spa/VEXO_Admin.html
  # ---- versions --------------------------------------------------------------
  # Android versionCode = BASE + github.run_number of THIS workflow (monotonic).
  USER_VERSION_NAME: '1.0.0'
  USER_VERSION_CODE_BASE: '100'
  USER_DISPLAY_NAME: 'VEXO'
  ADMIN_VERSION_NAME: '1.1.0'
  ADMIN_VERSION_CODE_BASE: '110'
  ADMIN_DISPLAY_NAME: 'VEXO 管理端'
  # ---- endpoints (user values are public; admin URL is secret-only) ----------
  USER_API_BASE: http://47.239.0.90
  USER_UPDATE_URL: http://47.239.0.90/updates/user/manifest.json

jobs:
  plan:
    name: Resolve commits and versions
    runs-on: ubuntu-latest
    outputs:
      user_sha: ${{ steps.p.outputs.user_sha }}
      admin_sha: ${{ steps.p.outputs.admin_sha }}
      user_sha7: ${{ steps.p.outputs.user_sha7 }}
      admin_sha7: ${{ steps.p.outputs.admin_sha7 }}
      user_code: ${{ steps.p.outputs.user_code }}
      admin_code: ${{ steps.p.outputs.admin_code }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - id: p
        env:
          IN_USER: ${{ inputs.user_sha }}
          IN_ADMIN: ${{ inputs.admin_sha }}
          IN_APPS: ${{ inputs.apps }}
        run: |
          set -euo pipefail
          U="${IN_USER:-$USER_SHA}"; A="${IN_ADMIN:-$ADMIN_SHA}"; APPS="${IN_APPS:-both}"
          for s in "$U" "$A"; do
            [[ "$s" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::'$s' is not a full 40-char commit SHA"; exit 1; }
          done
          N="${GITHUB_RUN_NUMBER}"
          UC=$((USER_VERSION_CODE_BASE + N)); AC=$((ADMIN_VERSION_CODE_BASE + N))
          case "$APPS" in
            both)  M='["user","admin"]';;
            user)  M='["user"]';;
            admin) M='["admin"]';;
          esac
          {
            echo "user_sha=$U"; echo "admin_sha=$A"
            echo "user_sha7=${U:0:7}"; echo "admin_sha7=${A:0:7}"
            echo "user_code=$UC"; echo "admin_code=$AC"
            echo "matrix=$M"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### VEXO packages, run #$N"
            echo "| app | commit | versionName | versionCode |"
            echo "|---|---|---|---|"
            echo "| user | \`$U\` | $USER_VERSION_NAME | $UC |"
            echo "| admin | \`$A\` | $ADMIN_VERSION_NAME | $AC |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.app }} ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.platform == 'ios' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.matrix) }}
        platform: [android, ios]
    env:
      APP: ${{ matrix.app }}
      PLATFORM: ${{ matrix.platform }}
      SRC_SHA: ${{ matrix.app == 'user' && needs.plan.outputs.user_sha || needs.plan.outputs.admin_sha }}
      SRC_SHA7: ${{ matrix.app == 'user' && needs.plan.outputs.user_sha7 || needs.plan.outputs.admin_sha7 }}
      NOVA_ADMIN_UPDATE_URL: ${{ matrix.app == 'admin' && secrets.NOVA_ADMIN_UPDATE_URL || '' }}
    steps:
      - name: Resolve names and versions
        run: |
          set -euo pipefail
          if [ "$APP" = user ]; then
            NAME_PREFIX=VEXO; VN="$USER_VERSION_NAME"; VC="${{ needs.plan.outputs.user_code }}"
            DISP="$USER_DISPLAY_NAME"; URL="$USER_UPDATE_URL"; PROJ="$GITHUB_WORKSPACE/src"
          else
            NAME_PREFIX=VEXO-Admin; VN="$ADMIN_VERSION_NAME"; VC="${{ needs.plan.outputs.admin_code }}"
            DISP="$ADMIN_DISPLAY_NAME"; PROJ="$GITHUB_WORKSPACE/src/admin"
            if [ -z "${NOVA_ADMIN_UPDATE_URL}" ]; then
              echo "::error::repo secret NOVA_ADMIN_UPDATE_URL is not set (there is no fallback)"; exit 1
            fi
            URL="$NOVA_ADMIN_UPDATE_URL"
          fi
          if [ "$PLATFORM" = android ]; then EXT=apk; KIND=debug; else EXT=ipa; KIND=unsigned; fi
          FILE="${NAME_PREFIX}-${VN}-${VC}-${SRC_SHA7}-${KIND}.${EXT}"
          {
            echo "PKG_FILE=$FILE"; echo "PKG_KIND=$EXT"; echo "PROJ=$PROJ"
            echo "APP_VERSION_NAME=$VN"; echo "APP_VERSION_CODE=$VC"
            echo "VEXO_VERSION_CODE=$VC"; echo "NOVA_VERSION_CODE=$VC"; echo "IPA_BUILD_VERSION=$VC"
            echo "EXPECT_NAME=$DISP"; echo "EXPECT_URL=$URL"
          } >> "$GITHUB_ENV"
          echo "will build $FILE from $SRC_SHA"

      - name: Checkout pack scripts (this branch)
        uses: actions/checkout@v4
        with:
          path: pack

      - name: Checkout ${{ matrix.app }} source @ pinned SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_SHA }}
          path: src

      - name: Confirm checked-out commit
        run: |
          test "$(git -C src rev-parse HEAD)" = "$SRC_SHA" || { echo "::error::checkout is not $SRC_SHA"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fixed debug keystore
        env:
          KS_B64: ${{ secrets.NOVA_DEBUG_KEYSTORE_BASE64 }}
          NOVA_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.NOVA_DEBUG_KEYSTORE_PASSWORD }}
          NOVA_DEBUG_KEY_ALIAS: ${{ secrets.NOVA_DEBUG_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for v in KS_B64 NOVA_DEBUG_KEYSTORE_PASSWORD NOVA_DEBUG_KEY_ALIAS; do
            [ -n "${!v}" ] || { echo "::error::debug keystore secret for $v is missing"; exit 1; }
          done
          KS="$RUNNER_TEMP/nova-debug.keystore"
          printf '%s' "$KS_B64" | base64 --decode > "$KS"
          echo "NOVA_DEBUG_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          CERT=$(keytool -list -v -keystore "$KS" -storepass "$NOVA_DEBUG_KEYSTORE_PASSWORD" -alias "$NOVA_DEBUG_KEY_ALIAS" \
                 | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          [ -n "$CERT" ] || { echo "::error::could not read the debug certificate"; exit 1; }
          echo "EXPECT_CERT=$CERT" >> "$GITHUB_ENV"

      # ---------------- user app: the pinned user commit's own scripts ----------
      - name: User app - check packaging scripts exist at this commit
        if: matrix.app == 'user'
        run: |
          for f in prepare-v2-web.sh build-debug-apk.sh build-unsigned-ipa.sh stamp-native.mjs; do
            test -f "src/scripts/$f" || { echo "::error::src/scripts/$f missing: pick a commit from v7-m7.r8-vexo or later"; exit 1; }
          done
          # stamp-native.mjs owns the user versionCode. Until it reads
          # VEXO_VERSION_CODE / APP_VERSION_CODE from env it writes its own constant.
          if ! grep -Eq 'process\.env\.(VEXO_VERSION_CODE|APP_VERSION_CODE)' src/scripts/stamp-native.mjs; then
            C=$(sed -n 's/^export const VERSION_CODE = \([0-9]*\);.*/\1/p' src/scripts/stamp-native.mjs)
            echo "::warning::user stamp-native.mjs ignores the CI versionCode; expecting its constant $C"
            echo "APP_VERSION_CODE=$C" >> "$GITHUB_ENV"
          fi

      - name: User app - build (rebuilds web JS from source)
        if: matrix.app == 'user'
        env:
          NOVA_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.NOVA_DEBUG_KEYSTORE_PASSWORD }}
          NOVA_DEBUG_KEY_ALIAS: ${{ secrets.NOVA_DEBUG_KEY_ALIAS }}
          NOVA_DEBUG_KEY_PASSWORD: ${{ secrets.NOVA_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          bash src/scripts/prepare-v2-web.sh user .
          if [ "$PLATFORM" = android ]; then
            bash src/scripts/build-debug-apk.sh . "$GITHUB_WORKSPACE/out/$PKG_FILE"
          else
            bash src/scripts/build-unsigned-ipa.sh . "$GITHUB_WORKSPACE/out/$PKG_FILE"
          fi

      # ---------------- admin app: this branch's scripts ------------------------
      - name: Admin app - build (rebuilds dist-spa from source)
        if: matrix.app == 'admin'
        env:
          NOVA_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.NOVA_DEBUG_KEYSTORE_PASSWORD }}
          NOVA_DEBUG_KEY_ALIAS: ${{ secrets.NOVA_DEBUG_KEY_ALIAS }}
          NOVA_DEBUG_KEY_PASSWORD: ${{ secrets.NOVA_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          bash pack/scripts/prepare-v2-web.sh admin "$PROJ"
          if [ "$PLATFORM" = android ]; then
            bash pack/scripts/build-debug-apk.sh "$PROJ" "$GITHUB_WORKSPACE/out/$PKG_FILE"
          else
            bash pack/scripts/build-unsigned-ipa.sh "$PROJ" "$GITHUB_WORKSPACE/out/$PKG_FILE"
          fi

      # ---------------- verification (fails the job) -----------------------------
      - name: Verify package (name, version, signer, update URL, icon)
        run: |
          set -euo pipefail
          CERT_ARG=()
          [ "$PKG_KIND" = apk ] && CERT_ARG=(--cert-sha256 "$EXPECT_CERT")
          node pack/scripts/verify-package.mjs --kind "$PKG_KIND" --file "out/$PKG_FILE" --project "$PROJ" \
            --name "$EXPECT_NAME" --version-name "$APP_VERSION_NAME" --version-code "$APP_VERSION_CODE" \
            --url "$EXPECT_URL" "${CERT_ARG[@]}" --meta-out "out/$PKG_FILE.verify.json"
          node -e '
            const fs=require("fs"); const f=process.argv[1];
            const m=JSON.parse(fs.readFileSync(f+".verify.json"));
            Object.assign(m,{app:process.env.APP, platform:process.env.PLATFORM, sourceSha:process.env.SRC_SHA,
              packScriptsSha:process.env.GITHUB_SHA, runId:process.env.GITHUB_RUN_ID, runNumber:process.env.GITHUB_RUN_NUMBER});
            fs.writeFileSync(f+".json", JSON.stringify(m,null,2)+"\n"); fs.unlinkSync(f+".verify.json");
          ' "out/$PKG_FILE"
          cat "out/$PKG_FILE.json"

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: meta-${{ env.PKG_FILE }}
          path: out/${{ env.PKG_FILE }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload user package artifact
        if: matrix.app == 'user'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_FILE }}
          path: out/${{ env.PKG_FILE }}
          if-no-files-found: error
          retention-days: 30

      # Admin packages are not uploaded as (publicly downloadable) Actions
      # artifacts. They go to the hidden server dir; release-draft.yml fetches
      # them from there only when include_admin is ticked.
      - name: Deploy admin package to server (hidden dir)
        if: matrix.app == 'admin' && (github.event_name == 'push' || inputs.deploy_admin)
        env:
          HOST: ${{ secrets.NOVA_ADMIN_DEPLOY_HOST }}
          DUSER: ${{ secrets.NOVA_ADMIN_DEPLOY_USER }}
          DPATH: ${{ secrets.NOVA_ADMIN_DEPLOY_PATH }}
          KEY: ${{ secrets.NOVA_ADMIN_DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.NOVA_ADMIN_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in HOST DUSER DPATH KEY KNOWN; do
            [ -n "${!v}" ] || { echo "::error::deploy secret for $v is missing"; exit 1; }
          done
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/known_hosts"
          SSH_OPTS=(-i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          scp -q "${SSH_OPTS[@]}" "out/$PKG_FILE" "out/$PKG_FILE.json" "$DUSER@$HOST:$DPATH/"
          # Stable URL for fast downloads from China: <dir>/VEXO-Admin-latest-debug.apk
          # and VEXO-Admin-latest-unsigned.ipa always point at the newest verified build.
          if [ "$PKG_KIND" = apk ]; then LATEST=VEXO-Admin-latest-debug.apk; else LATEST=VEXO-Admin-latest-unsigned.ipa; fi
          ssh "${SSH_OPTS[@]}" "$DUSER@$HOST" "cd '$DPATH' && cp -f '$PKG_FILE' '.$LATEST.tmp' && mv -f '.$LATEST.tmp' '$LATEST' && cp -f '$PKG_FILE.json' '$LATEST.json'"
          rm -f "$RUNNER_TEMP/deploy_key"
          echo "deployed $PKG_FILE (+ .json) to the hidden admin download dir" >> "$GITHUB_STEP_SUMMARY"
