<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA V5</title>
<style>
:root{--cv:#101114;--bg:#0B0C0F;--sf:#14161A;--s2:#1B1E23;--tx:#F5F6F7;--t2:#A4A9B2;--t3:#737985;--ln:#292D34;--ac:#2D88FF;--dg:#D4655A;--vip:#C8A96A;--onac:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--cv:#E6E8EC;--bg:#F0F2F5;--sf:#fff;--s2:#EEF0F3;--tx:#15171A;--t2:#5C6570;--t3:#8A9098;--ln:#E1E4E8;--ac:#1877F2;--dg:#B42318;--vip:#8C7340;--onac:#fff;color-scheme:light}
/* 香槟金主题（M2.4.5）：只在服务端确认 VIP 有效时由脚本设置 data-vip=gold；.gpv 是会员中心里的静态预览，用同一组颜色 */
:root[data-theme=dark][data-vip=gold],:root[data-theme=dark] .gpv.g{--ac:#D6B86F;--onac:#1A1408;--vip:#D6B86F;--ln:#2E2B25}
:root[data-theme=light][data-vip=gold],:root[data-theme=light] .gpv.g{--ac:#7A5A10;--onac:#fff;--vip:#7A5A10;--ln:#E4DFD3}
:root[data-theme=dark] .gpv.n{--ac:#2D88FF;--onac:#fff;--vip:#C8A96A;--ln:#292D34}
:root[data-theme=light] .gpv.n{--ac:#1877F2;--onac:#fff;--vip:#8C7340;--ln:#E1E4E8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--cv);color:var(--tx);overflow:hidden}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
#app{touch-action:pan-y;width:100%;max-width:430px;height:100%;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
#v{display:flex;flex-direction:column;height:100%}
.pg{flex:1;min-height:0;display:flex;flex-direction:column}.sc{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.top{flex:none;height:52px;display:flex;align-items:center;gap:2px;padding:0 6px 0 16px;background:var(--sf);border-bottom:1px solid var(--ln)}
.top.sub{padding-left:4px}.top h1{flex:1;font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.sub h1{font-size:18px}.top h1.br{color:var(--ac);letter-spacing:-.5px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none;position:relative}
.ib svg{width:24px;height:24px;fill:currentColor}.ib:active{background:var(--s2)}
.dot{position:absolute;top:9px;right:9px;width:10px;height:10px;border-radius:50%;background:var(--dg);border:2px solid var(--sf)}
nav{flex:none;display:flex;height:60px;background:var(--sf);border-top:1px solid var(--ln)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--t2);position:relative}
nav button.on{color:var(--ac);font-weight:700}nav svg{width:24px;height:24px;fill:currentColor}
.bdg{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--dg);color:#fff;font:700 11px/18px sans-serif;text-align:center;font-style:normal}
.seg{flex:none;display:flex;background:var(--sf);border-bottom:1px solid var(--ln)}
.seg button{flex:1;height:44px;font-weight:600;color:var(--t2);position:relative}.seg .on{color:var(--ac)}
.seg .on:after{content:"";position:absolute;left:25%;right:25%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--ac)}
.card{background:var(--sf);margin-bottom:8px;border-block:1px solid var(--ln)}
.row{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--ln)}.card .row{border:0}
.gr{flex:1;min-width:0}.gr b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gr small{display:block;color:var(--t2);font-size:13px;line-height:1.35}
small{color:var(--t2);font-size:13px}
.av{border-radius:50%;display:inline-grid;place-items:center;font-weight:700;flex:none}
.vip{display:inline-block;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.4px;line-height:1;padding:3px 6px;border-radius:7px;background:linear-gradient(135deg,#EBD9A8,#C8A96A);color:#2A1F08;vertical-align:2px}
.bd{padding:0 16px 12px;white-space:pre-wrap;word-break:break-word}
.sum{display:flex;justify-content:space-between;padding:0 16px 8px;color:var(--t2);font-size:13px;min-height:22px}
.bar{display:flex;border-top:1px solid var(--ln)}.bar button{flex:1;height:44px;color:var(--t2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.bar svg{width:20px;height:20px;fill:currentColor}.bar .on{color:var(--ac)}
.em{text-align:center;color:var(--t3);padding:32px 16px}
.comp{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--sf);border-bottom:8px solid var(--bg)}
.comp button.p{flex:1;height:44px;border-radius:22px;background:var(--s2);color:var(--t2);text-align:left;padding:0 16px}
.ppl{display:flex;gap:14px;overflow-x:auto;padding:12px 16px;background:var(--sf);border-bottom:8px solid var(--bg)}
.ppl button{flex:none;width:60px;font-size:12px;color:var(--t2);display:flex;flex-direction:column;align-items:center;gap:4px}
.ppl .av{outline:2px solid var(--ac);outline-offset:2px}
.pb{height:44px;padding:0 20px;border-radius:22px;background:var(--ac);color:var(--onac);font-weight:700;flex:none}.pb:active{transform:scale(.97)}
.pb:disabled{opacity:.4}.pb.off:disabled{opacity:1;background:var(--s2);color:var(--t2);border:1px dashed var(--t3);width:100%;height:36px;padding:0;margin-top:8px;font-size:14px;cursor:not-allowed}.pb.s{background:var(--s2);color:var(--tx)}.pb.d{background:var(--dg)}.pb.sm{height:36px;padding:0 14px;font-size:14px}
.inrow{flex:none;display:flex;gap:6px;align-items:center;padding:8px 8px 8px 12px;background:var(--sf);border-top:1px solid var(--ln)}
.inrow input{flex:1;min-width:0;height:44px;background:var(--s2);border-radius:22px;padding:0 16px}
.inrow .ib{color:var(--t2)}.nope{flex:none;padding:14px 16px;text-align:center;color:var(--t2);background:var(--sf);border-top:1px solid var(--ln);font-size:14px}
.rt{flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 16px;background:var(--s2);color:var(--t2);font-size:13px}
.fld{width:100%;background:var(--s2);border-radius:12px;padding:12px 14px;margin:6px 0 12px;display:block}textarea.fld{resize:none}
.lab{font-size:13px;color:var(--t2)}.fr{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding-top:4px}.fr .cn{margin-right:auto;font-size:13px;color:var(--t2)}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20}
.pn{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--sf);border-radius:16px 16px 0 0;padding:16px;z-index:21;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.pn h3{font-size:17px;margin-bottom:8px}.mi{display:block;width:100%;text-align:left;height:48px;font-weight:600}.mi.dg{color:var(--dg)}
.rxs{display:flex;justify-content:space-between;padding:8px 0}.rxs button{font-size:32px;width:52px;height:52px;border-radius:50%}.rxs button:active{background:var(--s2)}
.cm{display:flex;gap:8px;padding:8px 16px}.cm.sub{padding-left:52px}
.cb{background:var(--s2);border-radius:16px;padding:8px 12px;display:inline-block;max-width:100%;word-break:break-word}.cb b{display:block;font-size:14px}
.lk{font-size:13px;color:var(--t2);font-weight:600;padding:8px 2px}.lk.on{color:var(--ac)}
.ban{flex:none;background:var(--s2);padding:8px 16px;border-bottom:1px solid var(--ln);font-size:13px;color:var(--t2)}.ban b{display:block;color:var(--dg);font-size:15px}
.mr{display:flex;gap:8px;padding:4px 12px;align-items:flex-end}.mr.me{flex-direction:row-reverse}
.bub{max-width:100%;padding:9px 13px;border-radius:18px;background:var(--s2);word-break:break-word;white-space:pre-wrap}.me .bub{background:var(--ac);color:var(--onac)}
.mw{max-width:75%;display:flex;flex-direction:column}.me .mw{align-items:flex-end}.mt{font-size:11px;color:var(--t3);margin-top:2px}
.ph2{border:1px dashed var(--t3);border-radius:12px;padding:20px 28px;margin-bottom:4px;text-align:center;font-size:13px}
.pf{background:var(--sf);padding:16px;border-bottom:8px solid var(--bg)}.pr{display:flex;align-items:center;gap:20px;margin-bottom:12px}
.st{flex:1;display:flex;justify-content:space-around}.st button{display:flex;flex-direction:column;align-items:center;min-width:56px;min-height:44px;color:var(--t2);font-size:13px}.st b{font-size:18px;color:var(--tx)}
.pf h2{font-size:20px}.pf p{margin:6px 0 12px}.pf .fr{justify-content:stretch}.pf .fr .pb{flex:1}
.shd{padding:12px 16px;font-weight:700;font-size:17px}
.cover{height:84px;display:grid;place-items:center;font-size:40px;font-weight:800;color:#fff}
.chs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--ln)}
.chs button{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--s2);color:var(--t2);font-weight:600;font-size:14px}.chs .on{background:var(--ac);color:var(--onac)}
.cmi{padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--ln)}.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--s2);color:var(--t2);margin-left:6px;font-weight:400}
.nr{display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:52px;border-bottom:1px solid var(--ln)}.nr i{width:10px;height:10px;border-radius:50%;background:var(--ac);flex:none}.nr i.z{background:none}
.sw{display:flex;gap:8px}.sw .pb{height:36px;padding:0 16px}
.cvr{height:150px;position:relative}
.cam{position:absolute;right:12px;bottom:12px;height:36px;padding:0 14px;border-radius:18px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;font-weight:600}
.pf2{text-align:center}.avw{position:relative;width:104px;height:104px;margin:-52px auto 8px;border-radius:50%;border:4px solid var(--sf);background:var(--sf);display:grid;place-items:center}
.avw .cam{right:-12px;bottom:-4px;height:32px;padding:0 10px;font-size:13px}
.sts{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:2px 6px;color:var(--t2);font-size:14px;margin-bottom:12px}.sts button{min-height:44px;color:var(--t2)}.sts b{color:var(--tx)}
.ln2{padding:10px 0;border-bottom:1px solid var(--ln);text-align:left}.sq{width:56px;height:56px;border-radius:12px;border:2px solid var(--ln)}
.swr{position:relative;overflow:hidden;background:var(--sf)}.swa{position:absolute;right:0;top:0;bottom:0;display:flex}.swa button{width:72px;color:#fff;font-weight:600;font-size:14px}
.swc{background:var(--sf);position:relative;transition:transform .24s cubic-bezier(.2,.8,.2,1);touch-action:pan-y;user-select:none;-webkit-user-select:none}
#tt{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:40;display:none;white-space:nowrap;max-width:90%}

/* NOVA V5 手感：只用 transform/opacity，动画层由 65_feel.js 的 Web Animations 驱动 */
.pg{background:var(--bg)}
.sc{overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
body{overscroll-behavior:none}
.ghost{position:absolute;margin:0;pointer-events:none;overflow:hidden}
.pn{will-change:auto}
nav button,.pb,.ib,.lk,.mi,.nr,.row{transition:transform .14s ease,background-color .16s ease,opacity .16s ease}
nav button:active{transform:scale(.94)}.ib:active{transform:scale(.9)}.mi:active,.nr:active,.row[data-a]:active{background:var(--s2)}
.hxl{position:fixed;left:-99px;top:-99px;opacity:0;pointer-events:none}
.pinb{flex:none;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 16px;background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:2}
.pinb .gr b{font-weight:600;font-size:14px}.pinb small{color:var(--ac);font-weight:700}
.at{color:var(--ac);font-weight:700}.at.all{background:rgba(232,135,14,.18);color:#E8870E;border-radius:6px;padding:0 4px}.me .bub .at{color:var(--onac);text-decoration:underline}.me .bub .at.all{background:rgba(255,255,255,.25)}
.flash{animation:flash 1.3s ease-out}@keyframes flash{0%{background:rgba(45,136,255,.35)}100%{background:transparent}}
.err{background:rgba(212,101,90,.16);color:var(--dg);border-radius:12px;padding:10px 12px;margin:4px 0 12px;font-size:14px}
.auth{padding:8px 20px 28px}.auth h2{font-size:28px;font-weight:800;letter-spacing:-.4px;margin:8px 0 4px}.auth .hint{color:var(--t2);font-size:14px;margin:0 0 14px}.auth .lab{display:block;margin-top:4px}
.ban .lk{font-size:13px;padding:0 2px}
.ban.ok b{color:var(--ac)}
.av.ph{overflow:hidden;padding:0;background:#222}
.av.ph img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.cover{position:relative}
.cover.photo{height:128px;background-color:#1a1c20}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.sq.pick{padding:0;background-color:#1a1c20;background-size:cover;background-position:center}
.filepick{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100%;margin:0 0 8px}
.filepick input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px}
.crop{position:absolute;inset:0;z-index:60;background:#0b0c0f;display:flex;flex-direction:column;color:var(--tx)}
.cropbar{flex:none;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;background:#14161a;border-bottom:1px solid var(--ln)}
.cropbar b{font-size:16px}
.cropstage{position:relative;margin:16px auto 8px;overflow:hidden;background:#000;touch-action:none;flex:none}
.cropstage.av{width:280px;height:280px;border-radius:50%}
.cropstage.bg{width:min(360px,92%);aspect-ratio:20/9;border-radius:16px}
.cropstage img{position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-select:none;pointer-events:none}
.crophelp{color:var(--t2);text-align:center;font-size:13px;padding:4px 20px 8px}
.cropz{display:flex;align-items:center;gap:10px;padding:8px 20px 16px;color:var(--t2);font-size:14px}
.cropz input{flex:1;accent-color:var(--ac)}
/* 会员中心 */
.vp{padding:12px 16px}.vp b{display:block;font-size:17px;margin-bottom:4px}.vp small{display:block;margin-top:2px}
.vp[data-vs=active] b,.vp[data-vs=expiring] b{color:var(--vip)}
.tbox{border:1px dashed var(--vip);margin:8px 12px;border-radius:14px}
.plans{display:flex;gap:8px;padding:12px 16px 4px;background:var(--sf)}
.plan{flex:1;min-width:0;border:1px solid var(--ln);border-radius:14px;padding:12px}.plan.v{border-color:var(--vip)}
.plan b{display:block;font-size:16px}.plan .pp{font-size:15px;font-weight:700;margin:6px 0 4px;min-height:42px}.plan.v .pp{color:var(--vip)}
.vpn{padding:4px 16px 12px;background:var(--sf);border-bottom:8px solid var(--bg);color:var(--t2);font-size:13px}
.ent{padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--ln)}.ent .et b{display:inline}.ent .et small{display:block;margin-top:2px}
.ev{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.ev span{background:var(--s2);border-radius:10px;padding:4px 10px;font-size:13px}.ev i{font-style:normal;color:var(--t3);margin-right:6px}.ev .v{color:var(--vip)}
.gpvs{display:flex;gap:8px;padding:4px 16px 8px;background:var(--sf)}
.gpv{flex:1;min-width:0;border:1px solid var(--ln);border-radius:14px;padding:12px;background:var(--bg);color:var(--tx)}.gpv.g{border-color:var(--ac)}
.gpv .gh{display:flex;align-items:center;gap:8px;min-width:0}.gpv .gn{min-width:0}.gpv .gn b{display:block;margin:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gpv .gn small{color:var(--t2)}
.gpv .gl{color:var(--ac);font-weight:700;font-size:13px;margin-top:8px}
.gpv .gb{height:32px;border-radius:16px;background:var(--ac);color:var(--onac);font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:8px}
.gpv .gc{display:block;margin-top:6px;color:var(--t2);text-align:center}
.vtb{display:flex;gap:8px;padding:0 16px 12px;background:var(--sf)}.vtb .pb{flex:1}
.vtn{padding:0 16px 12px;background:var(--sf);border-bottom:8px solid var(--bg);color:var(--t2);font-size:13px}
/* VIP 资料装饰（M2.5.2）：只在服务端确认 profile_decoration 有效时由脚本加上 .dec / data-dec=gold；下一次渲染按服务端状态还原。 */
.av.dec{box-shadow:0 0 0 2px var(--vip),0 0 0 4px color-mix(in srgb,var(--vip) 35%,transparent)}
.avw.dec{border-color:var(--vip);box-shadow:0 0 0 2px color-mix(in srgb,var(--vip) 55%,transparent)}
.pf.dec{box-shadow:inset 0 3px 0 var(--vip)}
.cvr.dec{box-shadow:inset 0 -3px 0 var(--vip)}
.pdec{display:block;width:52px;height:8px;margin:2px auto 6px;background:linear-gradient(90deg,transparent,var(--vip),transparent);position:relative}
.pdec::before{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;background:var(--vip);transform:rotate(45deg);border-radius:1px}
</style></head><body>
