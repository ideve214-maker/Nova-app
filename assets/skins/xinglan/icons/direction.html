<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>星澜 图标方向</title>
<style>
  html,body{margin:0;background:#0A0C14;color:#F4F6FC;font:14px/1.4 "Noto Sans CJK SC",sans-serif}
  main{max-width:880px;margin:0 auto;padding:36px}
  h1{font-size:22px;letter-spacing:.08em;color:#6E8BFF;margin:0 0 8px}
  p{color:#9AA3B8;margin:0 0 24px}
  grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
  figure{margin:0;text-align:center}
  .cell{height:80px;border-radius:16px;border:1px solid #2A3044;background:#131622;display:grid;place-items:center;color:#F4F6FC}
  .cell svg{width:32px;height:32px}
  figcaption{margin-top:8px;font-size:12px;color:#9AA3B8}
  ul{color:#9AA3B8;line-height:1.7}
</style></head>
<body><main>
<h1>星澜 · 界面图标方向</h1>
<p>24×24 画板，1.75 描边，圆角端点。选中态用主色填充或 --ac-soft 底。原创，MIT。现有应用里的 Material 路径可在你点头后再替换。</p>
<grid>
<figure><div class="cell"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>home</title>
  <path d="M4.5 11.2 12 4.8l7.5 6.4"/>
  <path d="M6.5 10.2V19a1 1 0 0 0 1 1h3.2v-5.2h2.6V20h3.2a1 1 0 0 0 1-1v-8.8"/>
</svg>
</div><figcaption>home</figcaption></figure>
<figure><div class="cell"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>community</title>
  <circle cx="9" cy="8.5" r="2.6"/>
  <circle cx="16.2" cy="8.8" r="2.2"/>
  <path d="M4.6 18.2c.4-2.6 2.4-4 4.4-4s4 1.4 4.4 4"/>
  <path d="M13.4 15.2c1.1-.7 2.4-1 3.5-1 1.8 0 3.5 1 4 3.4"/>
</svg>
</div><figcaption>community</figcaption></figure>
<figure><div class="cell"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>chat</title>
  <path d="M5 16.6 3.8 20.2 7.6 18.4A8.2 8.2 0 1 0 5 16.6Z"/>
</svg>
</div><figcaption>chat</figcaption></figure>
<figure><div class="cell"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>profile</title>
  <circle cx="12" cy="8.2" r="3.2"/>
  <path d="M5 19.2c.6-3.2 3-5 7-5s6.4 1.8 7 5"/>
</svg>
</div><figcaption>profile</figcaption></figure>
<figure><div class="cell"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>search</title>
  <circle cx="11" cy="11" r="6"/>
  <path d="m15.8 15.8 4 4"/>
</svg>
</div><figcaption>search</figcaption></figure>
<figure><div class="cell"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>bell</title>
  <path d="M6 16.5c0-1 .5-2.2.5-4.3a5.5 5.5 0 1 1 11 0c0 2.1.5 3.3.5 4.3"/>
  <path d="M6 16.5h12"/>
  <path d="M10 16.5v.6a2 2 0 0 0 4 0v-.6"/>
  <path d="M12 6.2V4.6"/>
</svg>
</div><figcaption>bell</figcaption></figure>
<figure><div class="cell"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>back</title>
  <path d="M15 5 8 12l7 7"/>
</svg>
</div><figcaption>back</figcaption></figure>
<figure><div class="cell"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>plus</title>
  <path d="M12 5.5v13M5.5 12h13"/>
</svg>
</div><figcaption>plus</figcaption></figure>
<figure><div class="cell"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>more</title>
  <circle cx="6" cy="12" r="1.35" fill="currentColor" stroke="none"/>
  <circle cx="12" cy="12" r="1.35" fill="currentColor" stroke="none"/>
  <circle cx="18" cy="12" r="1.35" fill="currentColor" stroke="none"/>
</svg>
</div><figcaption>more</figcaption></figure>
<figure><div class="cell"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>send</title>
  <path d="M4.2 11.4 20 4.8 12.8 20l-1.6-6.6Z"/>
  <path d="m11.2 13.4 8.8-8.6"/>
</svg>
</div><figcaption>send</figcaption></figure>
<figure><div class="cell"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>settings</title>
  <circle cx="12" cy="12" r="3"/>
  <path d="M12 4.4v1.8M12 17.8v1.8M4.4 12h1.8M17.8 12h1.8M6.4 6.4l1.3 1.3M16.3 16.3l1.3 1.3M17.6 6.4 16.3 7.7M7.7 16.3 6.4 17.6"/>
</svg>
</div><figcaption>settings</figcaption></figure>
<figure><div class="cell"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>vip</title>
  <path d="M12 3.8 13.7 9h5.6l-4.5 3.3 1.7 5.4L12 14.6 7.5 17.7 9.2 12.3 4.7 9h5.6Z"/>
</svg>
</div><figcaption>vip</figcaption></figure>
</grid>
<ul>
  <li>网格：24 单位，内容区 20（上下左右各留 2）。</li>
  <li>描边 1.75，端点和转角都是 round，光学对齐（箭头类略伸出以平衡视觉）。</li>
  <li>默认色 --t2；悬停/选中 --ac；底栏选中可改实心。</li>
  <li>不使用商业图标库的专有形状；与星澜标志的圆润、锐利星芒同一气质。</li>
</ul>
</main></body></html>
