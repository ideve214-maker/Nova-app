<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>四子棋</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="四子棋 game in JS + Canvas. Play against artificial intelligence or with other human offline or online!"
    />
    
    
    
    
    <meta
      property="og:description"
      content="四子棋 game in JS + Canvas. Play against artificial intelligence or with other human offline or online!"
    />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="stylesheet" href="app.css"><style data-nova-hide-sb>html,body,*{scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0}</style><style data-nova-fit>
html,body{height:100%;max-width:100%;margin:0;overflow:hidden;background:#fff}
body{display:flex;flex-direction:column;align-items:stretch}
.header{flex:none;position:static;padding:4px 8px}
.header-title,.header h1{margin:4px 0;font-size:18px;display:flex;align-items:center;justify-content:center;gap:6px}
.section{flex:1;min-height:0;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:100%;overflow:hidden}
.section-message{flex:none;min-height:1.4em;font-size:14px;padding:0 8px}
.section-canvas{display:block;max-width:100%;height:auto;margin:0 auto}
.statusbox{flex:none;padding:8px 10px;box-sizing:border-box}
.statusbox-body,.statusbox-controls{flex-wrap:wrap;gap:8px;max-width:100%}
.footer{display:none}
table.visually-hidden{display:none!important}
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important;border:0!important}
dialog.init-screen,dialog.message-body{box-sizing:border-box;width:calc(100vw - 16px)!important;max-width:420px!important;max-height:calc(100vh - 16px);overflow:auto;padding:12px}
dialog.init-screen *{max-width:100%;box-sizing:border-box}
@media (max-width:400px){
  .game-settings-form{grid-template-columns:1fr!important;gap:8px}
  .game-settings-form-section{grid-column:1/-1}
  h1{font-size:1.15em;margin:.35em 0}
  h2{font-size:1em;margin:.35em 0}
  dialog.init-screen p{margin:.4em 0;font-size:14px;line-height:1.45}
}
</style></head>

  <body data-game="c4">
    <header class="header">
      <h1 class="header-title">
        <img
          src="logo.svg"
          alt="四子棋 logo"
          width="24"
          height="24"
        />
        四子棋
      </h1>
    </header>
    <section class="section">
      <div
        class="section-message"
        role="status"
        aria-label="Game updates"
        aria-live="polite"
        aria-atomic="true"
      ></div>
      <canvas class="section-canvas" aria-hidden="true"></canvas>
      <p
        class="visually-hidden board-player-legend"
        id="board-player-legend"
      ></p>
      <table
        class="visually-hidden board-state"
        aria-describedby="board-player-legend"
      >
        <caption>
          四子棋棋盘，从上到下列出各行。
        </caption>
        <thead>
          <tr>
            <th scope="col">行</th>
            <th scope="col">第1列</th>
            <th scope="col">第2列</th>
            <th scope="col">第3列</th>
            <th scope="col">第4列</th>
            <th scope="col">第5列</th>
            <th scope="col">第6列</th>
            <th scope="col">第7列</th>
          </tr>
        </thead>
        <tbody class="board-state-body"></tbody>
      </table>
      <fieldset class="hidden game-controls" tabindex="-1">
        <legend class="visually-hidden">
          四子棋列。轮到你时，按 1 到 7 向对应列落子。
        </legend>
        <button
          class="visually-hidden game-control"
          type="button"
          data-column="0"
          aria-keyshortcuts="1"
        >
          向第1列落子
        </button>
        <button
          class="visually-hidden game-control"
          type="button"
          data-column="1"
          aria-keyshortcuts="2"
        >
          向第2列落子
        </button>
        <button
          class="visually-hidden game-control"
          type="button"
          data-column="2"
          aria-keyshortcuts="3"
        >
          向第3列落子
        </button>
        <button
          class="visually-hidden game-control"
          type="button"
          data-column="3"
          aria-keyshortcuts="4"
        >
          向第4列落子
        </button>
        <button
          class="visually-hidden game-control"
          type="button"
          data-column="4"
          aria-keyshortcuts="5"
        >
          向第5列落子
        </button>
        <button
          class="visually-hidden game-control"
          type="button"
          data-column="5"
          aria-keyshortcuts="6"
        >
          向第6列落子
        </button>
        <button
          class="visually-hidden game-control"
          type="button"
          data-column="6"
          aria-keyshortcuts="7"
        >
          向第7列落子
        </button>
      </fieldset>
    </section>

    <dialog class="init-screen" aria-labelledby="init-screen-title">
      <h1 id="init-screen-title">
        <img
          src="logo.svg"
          alt="四子棋 logo"
          width="24"
          height="24"
        />
        四子棋
      </h1>
      <h2>玩法</h2>
      <p>两人轮流把棋子投入 7 列中的任意一列，棋子会落到该列最下方的空位。</p>
      <p>先在横、竖或斜线上连成四子的一方获胜；棋盘下满仍无人连成四子则为平局。</p>
      <h2>对局设置</h2>
      <form method="dialog" class="game-settings-form">
        <fieldset class="game-settings-form-section">
          <legend>对局模式</legend>
          <ul class="game-settings-mode-list">
            <li>
              <label
                ><input
                  class="game-settings-mode-input"
                  type="radio"
                  name="mode"
                  value="offline-ai"
                  checked
                  autofocus
                />
                人机对战</label
              >
            </li>
            <li>
              <label
                ><input
                  class="game-settings-mode-input"
                  type="radio"
                  name="mode"
                  value="offline-human"
                />
                双人同屏</label
              >
            </li>
            <li>
              <label
                ><input
                  class="game-settings-mode-input"
                  type="radio"
                  name="mode"
                  value="ai-vs-ai"
                />
                观战：电脑对电脑</label
              >
            </li>
          </ul>
        </fieldset>
        <label class="game-settings-player-1-name-label" for="player-1-name">
          玩家名称：
        </label>
        <input
          type="text"
          class="game-settings-player-1-name-input"
          id="player-1-name"
          value="玩家1"
          name="player-1-name"
          placeholder="玩家1"
        />
        <label class="game-settings-player-2-name-label" for="player-2-name">
          玩家名称：
        </label>
        <input
          type="text"
          class="game-settings-player-2-name-input"
          id="player-2-name"
          value="玩家2"
          name="player-2-name"
          placeholder="玩家2"
        />
        <button class="game-settings-submit" type="submit" value="confirm">
          开始游戏
        </button>
      </form>
    </dialog>
    <div class="statusbox hidden">
      <div class="statusbox-body">
        <div class="statusbox-body-connection">...</div>
        <div class="statusbox-body-game">...</div>
        <div class="statusbox-body-player">...</div>
      </div>
      <div class="statusbox-controls">
        <button
          class="hidden statusbox-button statusbox-button-share"
          type="button"
        >
          分享对局
        </button>
        <button
          class="hidden statusbox-button statusbox-button-back"
          type="button"
        >
          结束对局
        </button>
        <button
          class="hidden statusbox-button statusbox-button-play-again"
          type="button"
        >
          再来一局
        </button>
      </div>
    </div>

    <dialog class="message-body" aria-labelledby="message-title">
      <form method="dialog" class="message-form">
        <div class="message-body-content"></div>
        <button class="message-body-dismiss" type="submit" value="ok">
          确定
        </button>
      </form>
    </dialog>
    <footer class="footer">
    </footer>
  <script src="app.js"></script><script>
(function(){
  var game=document.body.getAttribute('data-game')||'';
  function send(n){n=Number(n)||0;if(!(n>0))return;try{parent.postMessage({type:'nova-score',game:game,score:n},'*')}catch(e){}}
  setInterval(function(){
    var el=document.querySelector('.score-container,#score,.score');
    if(!el)return;
    var n=parseInt(String(el.textContent).replace(/[^0-9]/g,''),10);
    if(n>0)send(n);
  },900);
})();
</script>
</body>
</html>
