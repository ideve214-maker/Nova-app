/* ===== 2.0.1 ===== */
/* 共创按钮在 iOS 上居中：明确水平/垂直居中，去掉系统按钮外观和基线偏移 */
.pjact,.pjadd,.pjws,.aimb,.vxbar,.v2form{--pbfix:1}
.pjact .pb,.pjadd .pb,.pjws .pb,.pjwsgo,.aimb .pb,.vxbar .pb{-webkit-appearance:none;appearance:none;display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1;gap:6px;white-space:nowrap;margin:0}
.pjact .pb>span,.pjadd .pb>span,.pjws .pb>span,.pjwsgo>span,.aimb .pb>span{display:block;line-height:1.2}
.pjact .pb svg,.pjadd .pb svg,.pjwsgo svg,.aimb .pb svg{flex:none;display:block}
/* 操作行：两列等宽网格，所有状态同高同圆角；只有一个按钮时占满 */
.pjact{display:grid!important;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.pjact .pb{width:100%;min-width:0;height:44px;min-height:44px;border-radius:12px;padding:0 10px;font-size:15px;flex:none}
.pjact .pb:only-child{grid-column:1/-1}
.pjact .pb.off{opacity:1;background:var(--s2);color:var(--t2);box-shadow:none}
/* 输入框占位文字不被截断/错位：固定高度 + normal 行高；16px 避免 iOS 聚焦放大 */
.pjadd input.fld,.pjadd select.fld,.vxbar .fld{height:44px;padding:0 12px;line-height:normal;font-size:16px;-webkit-appearance:none;appearance:none}
.pjadd input.fld::placeholder,.vxbar .fld::placeholder{line-height:normal;color:var(--t3)}
.pjadd textarea.fld{font-size:16px}
.pjtadd input.fld{flex:1 1 100%}
.pjtadd select.fld{flex:1 1 0}
.pjtadd .pb{height:44px;min-width:76px}
.pjadd .fr .pb{height:40px;min-width:110px}
/* 需要的技能：字更大 */
.skl{gap:8px}
.skl span{font-size:14px;padding:5px 12px;border-radius:14px;line-height:1.3}
/* 成员：标题和头像之间留空；一行最多 5 个，+N 叠放；不换行、不撑高 */
