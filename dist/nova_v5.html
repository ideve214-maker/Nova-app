/* VIP 状态与会员中心（M2.4.3）。
   数据全部来自服务端：/api/vip/catalog（公开目录）和 /api/vip/me（登录后）。
   这里只缓存服务端返回的结果用于显示；客户端既不保存也不能设置 VIP 身份。 */
const VIP={cat:null,me:null,busy:0,err:''};
/* 会员标识：只表示订阅状态，不是实名认证。 */
const vipBadge=()=>'<i class="vip" role="img" aria-label="NOVA VIP 会员">VIP</i>';
const pad2=n=>String(n).padStart(2,'0');
const vipDate=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
/* 把「权益在某套餐下的取值」写成人能读的文字；数字都来自服务端目录。 */
function vipFmt(e,plan){const v=e[plan];if(v===null||v===undefined)return '待定';if(e.kind==='flag')return v?'✓ 有':'— 无';
  if(typeof v==='object')return Object.keys(v).map(k=>((e.scopeNames&&e.scopeNames[k])||k)+' '+v[k]).join(' · ')+(e.unit?' '+e.unit:'');
  return v+(e.unit?' '+e.unit:'')}
/* 读取目录与当前状态。离线/演示模式不请求；失败只记录错误文字，由页面显示并允许重试。 */
async function loadVip(){
  if(!NET)return;VIP.busy=1;VIP.err='';
  const acct=MODE==='account'&&SESSION&&SESSION.token;
  const [c,m]=await Promise.all([VIP.cat?null:api('GET','/api/vip/catalog'),acct?api('GET','/api/vip/me'):null]);
  VIP.busy=0;
  if(c){if(c.s===200)VIP.cat=c.j;else VIP.err=errMsg(c,'读取会员信息失败')}
  if(m){if(m.s===200)VIP.me=m.j;else{VIP.me=null;VIP.err=errMsg(m,'读取会员状态失败')}}
  if(!acct)VIP.me=null;
  syncVipUser();
}
/* 某项 flag 权益是否由服务端确认为有效。只看 /api/vip/me 的缓存，客户端不能自己打开。 */

function vipBadgeOn(){return vipFlag('vip_badge')}

/* 服务端返回 vip_badge 有效，个人资料里的标识才亮；到期或撤销后下一次渲染立即去掉。 */

/* 香槟金主题（M2.4.5）：是否启用只看服务端返回的状态与权益（VIP 有效 + profile_theme_gold 开启），再加上本机的「不想用」偏好 D.st.vt===0。

async function saveItem(kind,target,title,excerpt){

/* ===== 15_perm.js ===== */
/* NOVA V5 权限表（纯逻辑，无界面依赖，可在 node 里单测）。
   注意：这是"演示版本地权限"，只决定界面能不能点；真正的权限必须由将来的服务端再校验一次。 */
const RANK={'所有者':4,'管理员':3,'版主':2,'成员':1,'':0};
/* 社区：每个动作需要的最低等级 */
const CMP={post:1,postAnn:2,pinMsg:2,delMsg:2,atAll:3,addChannel:3,editChannel:3,delChannel:3,invite:2,kick:3,setMod:3,setAdmin:4,editInfo:3,dissolve:4};
const canC=(role,act)=>(RANK[role]||0)>=CMP[act]&&(RANK[role]||0)>0;
/* 能不能管理某个成员：只能管理比自己等级低的人，且自己至少是管理员 */
const canManage=(my,target)=>(RANK[my]||0)>=CMP.kick&&(RANK[my]||0)>(RANK[target]||0);
/* 我能把对方设成哪些角色（所有者 → 管理员/版主/成员；管理员 → 版主/成员，且对方必须比我低） */
const assignable=(my,target)=>{if(!canManage(my,target))return[];return my=='所有者'?['管理员','版主','成员']:['版主','成员']};
/* 群聊：群主 > 管理员 > 成员 */
const GR={'群主':3,'管理员':2,'成员':1};
const GRP={pinMsg:2,atAll:2,rename:2,avatar:2,addMember:2,kick:2,setAdmin:3};
const canG=(role,act)=>(GR[role]||0)>=GRP[act];
const canKickG=(my,target)=>(GR[my]||0)>=GRP.kick&&(GR[my]||0)>(GR[target]||0);
if(typeof module!=='undefined')module.exports={RANK,CMP,canC,canManage,assignable,GR,GRP,canG,canKickG};

function ago(ms){
  if(!ms)return '';
  const d=Math.max(0,(typeof now==='function'?now():Date.now())-ms);
  if(d<60e3)return '刚刚';
  if(d<3600e3)return Math.floor(d/60e3)+' 分钟前';
  if(d<86400e3)return Math.floor(d/3600e3)+' 小时前';
  if(d<7*86400e3)return Math.floor(d/86400e3)+' 天前';
  return vipDate(ms);
}

/* M4.2 社区联网：登录后创建/加入/退出走服务器。演示社区仍只在本机。 */
function adoptCm(c){
  if(!c)return null;
  const ch=(c.channels||[]).map((x,i)=>[x.id,x.name,x.kind==='公告'||x.kindKey==='announce'?'公告':'文字',x.isDefault]);
  const mb={};
  (c.members||[]).forEach(m=>{
    rememberAuthor(m);
    const me=SESSION&&SESSION.user&&Number(SESSION.user.id)===Number(m.id);
    mb[me?'me':String(m.id)]=m.role;
  });
  if(c.owner)rememberAuthor(c.owner);
  return {id:c.id,n:c.name,d:c.description||'',m:c.memberCount||0,j:c.joined?1:0,r:c.role||'',ch,mb,vis:c.visibility,src:'net',banned:!!c.banned};
}
function netCm(){return usingNet()&&Array.isArray(S.communities)}
function cmSrc(){return netCm()?S.communities:D.cm}
async function loadCommunities(){
  if(!usingNet()||!SESSION)return;
  const [mine,disc]=await Promise.all([api('GET','/api/communities?mine=1'),api('GET','/api/communities')]);
  const map=new Map();
  if(mine.s===200)(mine.j.communities||[]).forEach(c=>map.set(c.id,adoptCm(c)));
  if(disc.s===200)(disc.j.communities||[]).forEach(c=>{if(!map.has(c.id))map.set(c.id,adoptCm(c))});
  S.communities=[...map.values()];
}
async function loadCommunity(id){
  if(!usingNet()||!SESSION)return;
  const r=await api('GET','/api/communities/'+id);
  if(r.s!==200)return null;
  const c=adoptCm(r.j.community);
  S.communities=S.communities||[];
  const i=S.communities.findIndex(x=>x.id==id);
  if(i>=0)S.communities[i]=Object.assign(S.communities[i],c,{mb:c.mb&&Object.keys(c.mb).length?c.mb:S.communities[i].mb});
  else S.communities.push(c);
  return c;
}

/* M4.3 单聊/群聊联网：登录后会话走服务器。演示会话仍只在本机。私聊在 M4.11 完成前标明尚未端到端加密。 */
function adoptCv(c){
  if(!c)return null;
  const me=SESSION&&SESSION.user&&SESSION.user.id;
  (c.members||[]).forEach(rememberAuthor);
  const others=(c.members||[]).filter(m=>Number(m.id)!==Number(me));
  const g=c.kind==='group'?1:0;
  const owner=c.owner||(c.members||[]).find(m=>m.roleKey==='owner'||m.role==='群主');
  const my=(c.members||[]).find(m=>Number(m.id)===Number(me));
  const title=g?(c.name||'群聊'):(others[0]?(others[0].displayName||others[0].username):'私聊');
  const adm=(c.members||[]).filter(m=>m.roleKey==='admin'||m.role==='管理员').map(m=>Number(m.id)===Number(me)?'me':String(m.id));
  return {
    id:c.id,g,n:title,mem:others.map(m=>String(m.id)),u:c.unread||0,
    own:owner?(Number(owner.id)===Number(me)?'me':String(owner.id)):'',
    adm,r:c.myRole||(my&&my.role)||'',src:'net',kind:c.kind,last:c.lastMessage||null,e2ee:false
  };
}
function netCv(){return typeof usingNet==='function'&&usingNet()&&Array.isArray(S.conversations)}
function cvSrc(){return netCv()?S.conversations:D.cv}
async function loadConversations(){
  if(typeof usingNet!=='function'||!usingNet()||!SESSION)return;
  const r=await api('GET','/api/conversations');
  if(r.s!==200){S.conversations=S.conversations||[];S.cvErr=errMsg(r,'会话加载失败');return}
  S.conversations=(r.j.conversations||[]).map(adoptCv);S.cvErr='';
}
async function loadConversation(id){
  if(typeof usingNet!=='function'||!usingNet()||!SESSION)return;
  const r=await api('GET','/api/conversations/'+id);
  if(r.s!==200)return null;
  const c=adoptCv(r.j.conversation);
  S.conversations=S.conversations||[];
  const i=S.conversations.findIndex(x=>x.id==id);
  if(i>=0)S.conversations[i]=Object.assign(S.conversations[i],c);
  else S.conversations.unshift(c);
  return c;
}
async function openDm(userId){
  const r=await api('POST','/api/conversations',{kind:'dm',userId:Number(userId)});
  if(r.s!==200){T(errMsg(r,'无法发起私聊'));return null}
  const c=adoptCv(r.j.conversation);
  S.conversations=S.conversations||[];
  if(!S.conversations.some(x=>x.id===c.id))S.conversations.unshift(c);
  else await loadConversations();
  return c;
}
async function createGroupChat(name,userIds){

  const c=adoptCv(r.j.conversation);
  S.conversations=S.conversations||[];
  S.conversations.unshift(c);
  return c;
}

function adoptMsg(m){
  if(!m)return null;
  rememberAuthor(m.author);
  const me=SESSION&&SESSION.user&&m.author&&Number(SESSION.user.id)===Number(m.author.id);
  return [me?'me':String(m.author.id),'t',typeof ago==='function'?ago(m.createdAt):'',me?'已发送':'',m.deleted?'（已撤回）':m.text,m.id];
}
function msgSrc(id){
  if(typeof usingNet==='function'&&usingNet())return (S.messages&&S.messages[id])||[];
  return D.m[id]||[];
}
async function loadMessages(id,cursor){
  if(typeof usingNet!=='function'||!usingNet()||!SESSION)return;
  const q=(cursor?'?cursor='+encodeURIComponent(cursor)+'&limit=50':'?limit=50');
  const r=await api('GET','/api/conversations/'+id+'/messages'+q);
  S.messages=S.messages||{};S.msgCursor=S.msgCursor||{};
  if(r.s!==200){S.messages[id]=S.messages[id]||[];return}
  const page=(r.j.messages||[]).map(adoptMsg);
  if(!cursor)S.messages[id]=page;
  else{
    const old=S.messages[id]||[];
    const seen=new Set(old.map(m=>m[5]));
    S.messages[id]=[...page.filter(m=>!seen.has(m[5])),...old];
  }
  S.msgCursor[id]=r.j.nextCursor||null;
}
async function sendNet(cid,text){
  const clientId='c'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
  const r=await api('POST','/api/conversations/'+cid+'/messages',{text,clientId});
  if(r.s!==200){T(errMsg(r,'发送失败'));return null}
  const m=adoptMsg(r.j.message);
  S.messages=S.messages||{};
  S.messages[cid]=S.messages[cid]||[];
  if(!S.messages[cid].some(x=>x[5]===m[5]))S.messages[cid].push(m);
  if(Array.isArray(S.conversations)){
    const i=S.conversations.findIndex(c=>c.id==cid);
    if(i>=0){const c=S.conversations.splice(i,1)[0];c.last=r.j.message;S.conversations.unshift(c)}
  }
  return r.j.message;
}

const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

/* ---- 声音（WebAudio 合成，无外部文件） ---- */
let _ac=null;
const TONES={tap:[[740,.035,.016,0]],switch:[[510,.04,.018,0]],send:[[620,.055,.028,0],[920,.065,.024,.065]],warn:[[210,.075,.024,0]],
  open:[[430,.05,.016,0],[640,.05,.012,.045]],close:[[560,.04,.012,0],[380,.05,.01,.04]],snap:[[600,.03,.018,0]],edge:[[300,.03,.01,0]],
  success:[[520,.05,.02,0],[780,.07,.02,.06]]};
function beep(kind){
  if(D.st.sound===0)return;
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    _ac=_ac||new AC();if(_ac.state==='suspended')_ac.resume();
    for(const [f,d,g,dl] of (TONES[kind]||TONES.tap)){const t=_ac.currentTime+dl,o=_ac.createOscillator(),n=_ac.createGain();
      o.type='sine';o.frequency.setValueAtTime(f,t);n.gain.setValueAtTime(.0001,t);n.gain.exponentialRampToValueAtTime(g,t+.008);n.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(n);n.connect(_ac.destination);o.start(t);o.stop(t+d+.02)}
  }catch(e){}
}
/* ---- 触觉：Android/桌面用 vibrate；iPhone Safari 没有 vibrate，用 iOS 18 的 <input switch> 触觉技巧（未在真机验证） ---- */
const HP={tap:10,switch:7,send:[10,24,12],warn:[18,30,18],open:8,close:6,snap:12,edge:6,success:[8,40,14]};
let _hx=null;
function iosTick(){try{if(!_hx){_hx=document.createElement('label');_hx.className='hxl';_hx.setAttribute('aria-hidden','true');
  const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');_hx.appendChild(i);document.body.appendChild(_hx)}_hx.click()}catch(e){}}
function haptic(kind){
  if(D.st.haptic===0)return;

  if(navigator.vibrate){try{if(navigator.vibrate(p))return}catch(e){}}

}
const FEEL={log:[],cap(){return navigator.vibrate&&!IOS?'此设备支持振动':IOS?'iPhone：使用系统开关触觉（实验功能，需 iOS 18 及以上，未在真机验证）':'此浏览器不支持振动，仍有音效'}};
function feel(kind){FEEL.log.push(kind);if(FEEL.log.length>60)FEEL.log.shift();beep(kind);haptic(kind)}
window.__feel=FEEL;
const KIND={send:['send','cs','cmsend','pub','saveedit','mkcm','mkg','grn2','sendm'],switch:['tab','go','back','user','post','cm','conv','chan','feed','cmseg','seg','mt'],
  warn:['report','delp','reset','dis2','kick','grm','gleave2','cvdel2','leave2','rmch2','delmsg'],close:['x'],success:['pin','unpin','setrole','cvpin','pinm','unpinm','setimg']};

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;feel(kindOf(el.dataset.a))},{capture:true});

/* ---- 页面转场：旧页面做成"幽灵层"滑出，新页面滑入 ---- */
let VIEW=null;
const cleanGhost=()=>document.querySelectorAll('#app>.ghost').forEach(g=>g.remove());
function ghostOf(el){
  const a=$('#app').getBoundingClientRect(),r=el.getBoundingClientRect(),g=el.cloneNode(true);
  g.classList.add('ghost');g.setAttribute('inert','');g.setAttribute('aria-hidden','true');
  g.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));g.querySelectorAll('[data-a],[data-d],[data-af]').forEach(x=>{x.removeAttribute('data-a');x.removeAttribute('data-af');x.removeAttribute('data-d')});
  Object.assign(g.style,{left:(r.left-a.left)+'px',top:(r.top-a.top)+'px',width:r.width+'px',height:r.height+'px'});
  $('#app').appendChild(g);
  const s1=el.querySelector('.sc'),s2=g.querySelector('.sc');if(s1&&s2)s2.scrollTop=s1.scrollTop;
  return g;
}
function run(el,frames,opt,done){
  if(!el||!el.animate){done&&done();return null}
  const a=el.animate(frames,{easing:EASE,fill:'both',...opt});let fin=false;
  const end=()=>{if(fin)return;fin=true;try{a.cancel()}catch(e){}done&&done()};
  a.onfinish=end;setTimeout(end,(opt.duration||300)+250);return a;
}
const T3=x=>`translate3d(${x},0,0)`;
function render(){
  const cur=S.st[S.st.length-1],key=cur||S.tab,pv=VIEW,oldPg=$('#v .pg'),oldSh=$('#v .pn'),oldOv=$('#v .ov'),oldShKey=S.shk||null;
  const anim=!RM()&&!S.noAnim&&pv;
  let gp=null,gs=null,go=null;
  if(anim&&pv.key!==key&&oldPg)gp=ghostOf(oldPg);
  if(anim&&oldSh&&!S.sh){gs=ghostOf(oldSh);go=oldOv?ghostOf(oldOv):null}
  cleanGhostExcept([gp,gs,go]);
  renderCore();
  S.noAnim=0;
  const now={key,tab:S.tab,depth:S.st.length};
  const newPg=$('#v .pg'),newSh=$('#v .pn'),newOv=$('#v .ov');
  if(anim){
    if(gp&&newPg){
      const kind=pv.tab!==now.tab||pv.depth===now.depth?'tab':now.depth>pv.depth?'push':'pop';
      if(kind==='push'){newPg.style.zIndex=2;newPg.style.position='relative';gp.style.zIndex=1;
        run(newPg,[{transform:T3('100%')},{transform:'none'}],{duration:340},()=>{newPg.style.zIndex='';newPg.style.position=''});
        run(gp,[{transform:'none',opacity:1},{transform:T3('-26%'),opacity:.55}],{duration:340},()=>gp.remove())}
      else if(kind==='pop'){gp.style.zIndex=3;
        run(newPg,[{transform:T3('-26%'),opacity:.55},{transform:'none',opacity:1}],{duration:320});
        run(gp,[{transform:'none'},{transform:T3('100%')}],{duration:320},()=>gp.remove())}
      else{gp.style.zIndex=3;
        run(newPg,[{opacity:0,transform:'translate3d(0,8px,0)'},{opacity:1,transform:'none'}],{duration:240});
        run(gp,[{opacity:1},{opacity:0}],{duration:160},()=>gp.remove())}
    }
    if(newSh&&!oldSh){feel('open');
      run(newSh,[{transform:'translate3d(0,100%,0)'},{transform:'none'}],{duration:300});
      run(newOv,[{opacity:0},{opacity:1}],{duration:220})}
    if(gs){feel('close');gs.style.zIndex=22;if(go)go.style.zIndex=21;
      run(gs,[{transform:'none'},{transform:'translate3d(0,100%,0)'}],{duration:240,easing:'cubic-bezier(.4,0,1,1)'},()=>gs.remove());
      if(go)run(go,[{opacity:1},{opacity:0}],{duration:240},()=>go.remove())}
  }
  VIEW=now;
}
function cleanGhostExcept(keep){document.querySelectorAll('#app>.ghost').forEach(g=>{if(!keep.includes(g))g.remove()})}

/* ---- 边缘右滑返回（从屏幕左缘 24px 内向右拖） ---- */
const viewHTML=k=>k?page(k):S.tab=='home'?tHome():S.tab=='cm'?tCm():S.tab=='chat'?tChat():tMe();
let eb=null;
document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1||!S.st.length||S.sh||S.crop)return;const t=e.touches[0],a=$('#app').getBoundingClientRect();
  if(t.clientX-a.left>24)return;eb={x:t.clientX,y:t.clientY,lock:0,pg:$('#v .pg'),under:null,dx:0,t0:Date.now(),w:a.width};
},{passive:true});

  if(!eb)return;const t=e.touches[0],dx=t.clientX-eb.x,dy=t.clientY-eb.y;
  if(!eb.lock){if(dx>8&&dx>Math.abs(dy)*1.5){eb.lock=1;
      const k=S.st.length>1?S.st[S.st.length-2]:null,tmp=document.createElement('div');tmp.innerHTML=viewHTML(k);const u=tmp.firstElementChild,r=eb.pg.getBoundingClientRect(),a=$('#app').getBoundingClientRect();
      u.classList.add('ghost');u.setAttribute('inert','');Object.assign(u.style,{left:(r.left-a.left)+'px',top:(r.top-a.top)+'px',width:r.width+'px',height:r.height+'px',zIndex:1});
      $('#app').appendChild(u);eb.under=u;eb.pg.style.position='relative';eb.pg.style.zIndex=2}
    else if(Math.abs(dy)>8){eb=null;return}else return}
  if(e.cancelable)e.preventDefault();eb.dx=Math.max(0,dx);const p=Math.min(1,eb.dx/eb.w);
  eb.pg.style.transform=T3(eb.dx+'px');eb.pg.style.boxShadow='-10px 0 24px rgba(0,0,0,.28)';
  eb.under.style.transform=T3((-26+26*p)+'%');eb.under.style.opacity=.55+.45*p;

const ebEnd=commit=>{

  if(commit){feel('snap');
    run(b.pg,[{transform:T3(b.dx+'px')},{transform:T3('100%')}],{duration:200,easing:'cubic-bezier(.3,.6,.4,1)'},()=>{b.under&&b.under.remove();S.noAnim=1;A.back();render()});
    run(b.under,[{transform:b.under.style.transform,opacity:b.under.style.opacity},{transform:'none',opacity:1}],{duration:200})}
  else{run(b.pg,[{transform:T3(b.dx+'px')},{transform:'none'}],{duration:240},fin);run(b.under,[{transform:b.under.style.transform},{transform:T3('-26%')}],{duration:240})}
};
document.addEventListener('touchend',()=>{if(!eb)return;const v=eb.dx/Math.max(1,Date.now()-eb.t0);ebEnd(eb.dx>eb.w*.33||v>.6)},{passive:true});

/* ---- 滚动阻尼：到顶/到底继续拖会有橡皮筋感。iPhone 自带原生回弹，不重复做 ---- */
let od=null;
document.addEventListener('touchstart',e=>{
  if(IOS||eb||RM())return;const sc=e.target.closest&&e.target.closest('.sc');if(!sc||e.touches.length!==1)return;
  od={sc,y:e.touches[0].clientY,off:0,on:0,tick:0};
},{passive:true});

  if(!od||eb)return;const sc=od.sc,d=e.touches[0].clientY-od.y,top=sc.scrollTop<=0,bot=sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1;
  if(!od.on&&!((top&&d>0)||(bot&&d<0)))return;
  if(!od.on){od.on=1;od.y=e.touches[0].clientY;return}
  const dd=e.touches[0].clientY-od.y;if((top&&dd<=0&&!bot)||(bot&&dd>=0&&!top)){od.off=0;sc.style.transform='';return}
  if(e.cancelable)e.preventDefault();const s=Math.sign(dd),m=Math.abs(dd);od.off=s*Math.min(130,m*.42*(1-Math.min(.6,m/900)));
  sc.style.transition='none';sc.style.transform=`translate3d(0,${od.off}px,0)`;
  if(!od.tick&&Math.abs(od.off)>50){od.tick=1;feel('edge')}
},{passive:false});

/* ===== 66_swipe.js ===== */
/* NOVA V5 统一左滑组件：任何 .swr > .swc 行都可左滑露出 .swa 里的按钮。
   用法：swrow('data-a="xx" data-v="1"', 行内部HTML, [[动作,文字,颜色,值],...])
   规则：同一时间只展开一行；轻扫(速度够快)或拖过一半即展开；展开后点行本身收起；垂直滚动时不抢手势。 */
const swrow=(attrs,inner,acts,cls='row')=>`<div class="swr"><div class="swa">${acts.map(a=>`<button style="background:${a[2]}" data-a="${a[0]}" data-v="${a[3]}">${esc(a[1])}</button>`).join('')}</div><div class="${cls} swc" data-w="${72*acts.length}" ${attrs}>${inner}</div></div>`;
let sw=null;
const swClose=x=>{x.classList.remove('o');x.style.transform=''};
document.addEventListener('pointerdown',e=>{
  const r=e.target.closest('.swc');document.querySelectorAll('.swc.o').forEach(x=>{if(x!==r)swClose(x)});
  if(!r||r.dataset.a=='unhide'||e.target.closest('.swa'))return;
  sw={r,x:e.clientX,y:e.clientY,d:0,m:0,W:+r.dataset.w,o:r.classList.contains('o'),t0:Date.now(),last:e.clientX,lt:Date.now(),v:0};
});
document.addEventListener('pointermove',e=>{
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.m){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy))sw.m=1;else if(Math.abs(dy)>8){sw=null;return}else return}
  const now=Date.now();if(now>sw.lt){sw.v=(e.clientX-sw.last)/(now-sw.lt);sw.last=e.clientX;sw.lt=now}
  let t=(sw.o?-sw.W:0)+dx;t=t>0?t*.25:t<-sw.W?-sw.W+(t+sw.W)*.25:t;   /* 两端带阻尼 */
  sw.r.style.transition='none';sw.r.style.transform='translateX('+t+'px)';sw.d=t;
});
const swEnd=()=>{
  if(!sw)return;const r=sw.r;
  if(sw.m){r.style.transition='';const open=sw.v<-.5?true:sw.v>.5?false:sw.d<-sw.W/2,was=sw.o;
    r.classList.toggle('o',open);r.style.transform=open?'translateX('+(-sw.W)+'px)':'';S.nc=Date.now();if(open!==was)feel('snap')}
  sw=null;
};
document.addEventListener('pointerup',swEnd);
document.addEventListener('pointercancel',()=>{if(sw){sw.r.style.transition='';sw=null}});

/* 头像 / 背景裁剪。上传只接受图片，输出压缩后的 jpeg，不把原始文件直接塞进页面。 */
function cropBox(imgW,imgH,vw,vh,zoom,x,y){
  const z=Math.max(1,Math.min(3,+zoom||1));
  const base=Math.max(vw/imgW,vh/imgH);
  const s=base*z;
  const dw=imgW*s,dh=imgH*s;
  const maxX=Math.max(0,(dw-vw)/2),maxY=Math.max(0,(dh-vh)/2);
  const cx=Math.max(-maxX,Math.min(maxX,+x||0)),cy=Math.max(-maxY,Math.min(maxY,+y||0));
  let sx=(dw/2-vw/2-cx)/s,sy=(dh/2-vh/2-cy)/s,sw=vw/s,sh=vh/s;
  if(sx<0){sw+=sx;sx=0} if(sy<0){sh+=sy;sy=0}
  if(sx+sw>imgW)sw=imgW-sx; if(sy+sh>imgH)sh=imgH-sy;
  if(sw<1)sw=1; if(sh<1)sh=1;
  return {sx,sy,sw,sh,x:cx,y:cy,zoom:z};
}
function layoutCrop(){
  const c=S.crop; if(!c)return;
  const stage=$('#cropstage'),img=$('#cropimg'); if(!stage||!img||!c.w)return;
  const vw=stage.clientWidth,vh=stage.clientHeight; if(!vw||!vh)return;
  c.vw=vw;c.vh=vh;
  const box=cropBox(c.w,c.h,vw,vh,c.zoom,c.x,c.y);
  c.x=box.x;c.y=box.y;c.zoom=box.zoom;
  const base=Math.max(vw/c.w,vh/c.h),s=base*c.zoom;
  img.style.width=(c.w*s)+'px'; img.style.height=(c.h*s)+'px';
  img.style.transform=`translate(calc(-50% + ${c.x}px), calc(-50% + ${c.y}px))`;
}
function closeCrop(){
  const c=S.crop; if(c&&c.blob&&c.url)URL.revokeObjectURL(c.url);
  S.crop=null; const el=$('#crop'); if(el)el.remove();
}
function showCrop(){
  const c=S.crop; if(!c)return;
  const old=$('#crop'); if(old)old.remove();
  const title=c.kind==='bg'||c.kind==='cmbg'?'裁剪背景':'裁剪头像';
  const cls=c.kind==='bg'||c.kind==='cmbg'?'bg':'av';
  const el=document.createElement('div'); el.id='crop'; el.className='crop';
  el.innerHTML=`<div class="cropbar"><button class="pb sm s" data-a="cropx">取消</button><b>${title}</b><button class="pb sm" data-a="cropok">使用</button></div><div class="cropstage ${cls}" id="cropstage"></div><p class="crophelp">拖动调整位置。双指或下面的滑杆可以缩放，圆框或横框里的部分会被留下。</p><label class="cropz">缩放<input id="cropz" type="range" min="100" max="300" value="${Math.round(c.zoom*100)}"></label>`;
  const img=document.createElement('img'); img.id='cropimg'; img.alt=''; img.draggable=false;
  img.onload=()=>{c.w=img.naturalWidth;c.h=img.naturalHeight;layoutCrop()};
  img.src=c.url; el.querySelector('#cropstage').appendChild(img);
  $('#app').appendChild(el);
}
function openCropFromFile(kind,id,file){
  if(!file)return;
  const okType=/^image\//.test(file.type)||/\.(jpe?g|png|webp|gif|bmp|heic|heif)$/i.test(file.name||'');
  if(!okType){T('请从相册或文件里选择图片');return}
  if(file.size>12*1024*1024){T('图片超过 12MB，请换一张小一点的');return}
  const url=URL.createObjectURL(file), probe=new Image();
  probe.onload=()=>{
    if(!probe.naturalWidth){URL.revokeObjectURL(url);T('这张图片读不了，请换 jpg 或 png');return}
    closeCrop(); S.sh=null;
    S.crop={kind,id:id||'',url,blob:true,w:probe.naturalWidth,h:probe.naturalHeight,zoom:1,x:0,y:0};
    render(); showCrop();
  };
  probe.onerror=()=>{URL.revokeObjectURL(url);T('这张图片读不了，请换 jpg 或 png')};
  probe.src=url;
}
function safePhoto(src,allow){return allow.includes(src)}
function applyLook(kind,id,url){
  if(kind==='av'){D.pf.me.ph=url;return true}
  if(kind==='bg'){D.pf.me.bg=url;return true}
  if(kind==='gav'){const c=cvf(id);if(!c||!gAdm(c)){T('没有权限');return false}c.gp=url;gm(id,'你更换了群头像');return true}
  if(kind==='cmbg'||kind==='cmav'){const c=cmp(id);if(!c||(c.r!=='所有者'&&c.r!=='管理员')){T('没有权限');return false}if(kind==='cmbg')c.bg=url;else c.cp=url;return true}
  return false;
}
function applyCrop(){
  const c=S.crop; if(!c)return;
  const img=$('#cropimg'); if(!img||!img.naturalWidth){T('图片还没准备好');return}
  layoutCrop();
  const box=cropBox(c.w,c.h,c.vw,c.vh,c.zoom,c.x,c.y);
  const wide=c.kind==='bg'||c.kind==='cmbg', outW=wide?960:320, outH=wide?432:320;
  const canvas=document.createElement('canvas'); canvas.width=outW; canvas.height=outH;
  const g=canvas.getContext('2d');
  g.drawImage(img,box.sx,box.sy,box.sw,box.sh,0,0,outW,outH);
  let q=0.82, url=canvas.toDataURL('image/jpeg',q);
  while(url.length>280000&&q>0.5){q-=0.08;url=canvas.toDataURL('image/jpeg',q)}
  if(url.length>420000){T('裁剪结果太大，请缩小一点或换一张');return}
  if(!applyLook(c.kind,c.id,url))return;
  closeCrop(); T('已保存');
}
